[workspace]
members = [
    "platform",
    "edge",
    "sdk",
]
resolver = "2"

[workspace.package]
version = "4.0.0"
edition = "2021"
authors = ["Resonance Contributors"]
license = "Apache-2.0"
repository = "https://github.com/theworker02/resonance"
description = "Open spatial acoustic intelligence infrastructure"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
