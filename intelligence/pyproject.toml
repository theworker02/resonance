[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resonance-intelligence"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchaudio>=2.2",
    "onnxruntime>=1.17",
    "nats-py>=2.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "asyncio-nats-client>=0.11",
    "jsonschema>=4.21",
]

[project.scripts]
resonance-bench = "intelligence.evaluation.benchmarks:main"
resonance-research = "intelligence.research.research_mode:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelligence*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.toml"]
