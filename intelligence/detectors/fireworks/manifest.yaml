name: fireworks_event
version: 0.5.0
description: "Detects fireworks: aerial bursts, ground-level devices, and sustained displays."
author: "Resonance Contributors"
license: "Apache-2.0"

inputs:
  - spectral_embedding
  - envelope
  - impulse_features
  - mfcc
  - temporal_pattern

outputs:
  - fireworks_aerial_burst
  - fireworks_ground_level
  - fireworks_sustained_display
  - unknown_fireworks

prohibited_capabilities: []
required_capabilities: []

min_snr_db: 4.0
min_peak_energy_db: 55.0

notes: >
  Fireworks share impulsive characteristics with gunfire but have distinctive
  spectral signatures: aerial bursts produce a sharp crack followed by a long
  descending tail with multiple secondary pops. Ground-level devices have
  lower peak energy and more mid-range frequency content. Sustained displays
  are characterized by repeated bursts with irregular inter-event timing.

changelog:
  - "0.5.0: Initial heuristic release"
