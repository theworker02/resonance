name: glass_break
version: 0.5.0
description: "Detects glass breaking events: residential windows, commercial plate glass, and vehicle windows."
author: "Resonance Contributors"
license: "Apache-2.0"

inputs:
  - spectral_embedding
  - envelope
  - mfcc
  - high_freq_features

outputs:
  - glass_residential
  - glass_commercial
  - glass_vehicle
  - unknown_glass

prohibited_capabilities: []
required_capabilities: []

min_snr_db: 4.0
min_peak_energy_db: 50.0

notes: >
  Glass breaking is characterized by a sharp broadband transient followed by
  high-frequency crystalline ringing. Commercial plate glass produces more
  low-frequency content due to mass. Vehicle glass (tempered) produces a
  distinctive shatter with less ringing than annealed glass.

changelog:
  - "0.5.0: Initial heuristic release"
