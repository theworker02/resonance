<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Resonance Social Card: 1200x630 for OG/Twitter previews -->
  
  <!-- Deep Graphite background -->
  <rect width="1200" height="630" fill="#111318"/>
  
  <!-- Subtle dot grid pattern at 5% opacity -->
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  
  <!-- Logo mark centered in upper area -->
  <g transform="translate(510, 140) scale(1.5)">
    <!-- Connecting lines -->
    <line x1="25" y1="25" x2="95" y2="25" stroke="#FFFFFF" stroke-width="0.75" opacity="0.2"/>
    <line x1="25" y1="95" x2="95" y2="95" stroke="#FFFFFF" stroke-width="0.75" opacity="0.2"/>
    <line x1="25" y1="25" x2="25" y2="95" stroke="#FFFFFF" stroke-width="0.75" opacity="0.2"/>
    <line x1="95" y1="25" x2="95" y2="95" stroke="#FFFFFF" stroke-width="0.75" opacity="0.2"/>
    
    <!-- Wave arcs -->
    <path d="M 65 40 A 20 20 0 0 1 65 80" fill="none" stroke="#5AD7FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 32 A 28 28 0 0 1 72 88" fill="none" stroke="#5AD7FF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 79 24 A 36 36 0 0 1 79 96" fill="none" stroke="#5AD7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Node dots -->
    <circle cx="25" cy="25" r="5" fill="#FFFFFF"/>
    <circle cx="95" cy="25" r="5" fill="#FFFFFF"/>
    <circle cx="25" cy="95" r="5" fill="#FFFFFF"/>
    <circle cx="95" cy="95" r="5" fill="#FFFFFF"/>
  </g>
  
  <!-- "Resonance" wordmark -->
  <text x="600" y="430" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="54" letter-spacing="1.08" fill="#FFFFFF">Resonance</text>
  
  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="22" fill="#EEF2F5">Spatial Acoustic Intelligence</text>
</svg>
