<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Resonance Wordmark: Logo mark + "Resonance" text lockup -->
  
  <!-- Logo mark (scaled to fit left side) -->
  <g transform="translate(10, 10) scale(0.833)">
    <!-- Connecting lines -->
    <line x1="25" y1="25" x2="95" y2="25" stroke="#7667FF" stroke-width="0.75" opacity="0.3"/>
    <line x1="25" y1="95" x2="95" y2="95" stroke="#7667FF" stroke-width="0.75" opacity="0.3"/>
    <line x1="25" y1="25" x2="25" y2="95" stroke="#7667FF" stroke-width="0.75" opacity="0.3"/>
    <line x1="95" y1="25" x2="95" y2="95" stroke="#7667FF" stroke-width="0.75" opacity="0.3"/>
    
    <!-- Wave arcs -->
    <path d="M 65 40 A 20 20 0 0 1 65 80" fill="none" stroke="#5AD7FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 32 A 28 28 0 0 1 72 88" fill="none" stroke="#5AD7FF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 79 24 A 36 36 0 0 1 79 96" fill="none" stroke="#5AD7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Node dots -->
    <circle cx="25" cy="25" r="5" fill="#7667FF"/>
    <circle cx="95" cy="25" r="5" fill="#7667FF"/>
    <circle cx="25" cy="95" r="5" fill="#7667FF"/>
    <circle cx="95" cy="95" r="5" fill="#7667FF"/>
  </g>
  
  <!-- "Resonance" wordmark text: Inter Bold, tracked +2% -->
  <text x="125" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="38" letter-spacing="0.76" fill="#111318">Resonance</text>
</svg>
